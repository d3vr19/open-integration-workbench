openapi: 3.1.0
info:
  title: Open Integration Workbench API
  version: 0.1.0
  description: |
    REST API for Open Integration Workbench (OIW).

    Spec ref: §21.1 (REST Endpoints), §6.2 (OpenAPI 3.1 first).

    All endpoints are prefixed with `/api/v1`. Authentication is disabled in
    local mode (localhost only); team mode uses JWT via Gitea OAuth2 (spec §21.4).

    The API is the contract between the visual designer (apps/web), the CLI,
    the MCP server, and external agents. The implementation language of the
    server may change (Python FastAPI prototype → Kotlin/Spring Boot per
    ADR-PY-002 and ADR-PY-001), but this contract is versioned and stable.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: Open Integration Workbench
    url: https://github.com/hehenaice/open-integration-workbench

servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://oiw.localhost
    description: Team deployment (behind Traefik)

tags:
  - name: Projects
    description: Project manifest and lifecycle
  - name: Flows
    description: Integration flow IR
  - name: Validation
    description: Schema + rule-based validation
  - name: Tests
    description: FlowTest execution
  - name: Builds
    description: Deterministic artifact compilation
  - name: Git
    description: Git status and commit proposals
  - name: Archive
    description: Safe archive inspection
  - name: Experiments
    description: |
      B2 Experiment Engine campaign records (variant ladders over the tenant
      oracle). Read-only; campaigns are launched via `oiw experiment run` (CLI,
      operator-gated) and records persist under `.oiw/experiments/`.
  - name: Laws
    description: |
      Tenant-law registry (B2). Evidence-attached laws derived from experiment
      campaigns + manual blood laws. Read-only; ratification stays a CLI
      operator action (`oiw experiment ratify`) — never a UI write.
  - name: Calibrations
    description: |
      Cached tenant-oracle calibration reports (read-only). Powers the
      local-trace vs tenant-MPL comparison view.

paths:
  /api/v1/projects:
    get:
      tags: [Projects]
      summary: List projects in the workspace
      description: Scans the configured workspace directory for OIW projects (directories containing `oiw.yaml`).
      operationId: listProjects
      parameters:
        - name: workspace
          in: query
          description: Workspace root directory (defaults to server config).
          schema:
            type: string
      responses:
        "200":
          description: List of projects found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectSummary"

  /api/v1/projects/{projectId}:
    get:
      tags: [Projects]
      summary: Get project manifest
      operationId: getProject
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{projectId}/flows:
    get:
      tags: [Flows]
      summary: List flows in a project
      operationId: listFlows
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: List of flows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlowSummary"

  /api/v1/projects/{projectId}/flows/{flowId}:
    get:
      tags: [Flows]
      summary: Get the full IR of an integration flow
      operationId: getFlow
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/FlowId"
      responses:
        "200":
          description: Flow IR.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationFlow"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Flows]
      summary: Apply typed patch operations to a flow
      description: |
        Spec ref: §12.5 (Typed Patch Format), §12.1 (all mutations go through
        typed patches — the LLM never edits files directly; the UI uses the
        same patch mechanism).

        Supported operations:
          - `addNode` — add a new node with optional diagram position
          - `removeNode` — remove a node (and its edges) by ID
          - `updateNodeConfig` — update a node's config (partial merge by default)
          - `addEdge` — add an edge between two nodes
          - `removeEdge` — remove an edge by from+to
          - `moveNode` — update a node's position in diagram.json

        The server validates:
          1. Base revision matches HEAD (if `base_revision` is provided)
          2. All referenced nodes exist
          3. No cycles are introduced
          4. No duplicate node IDs

        On success, writes `flow.yaml` and `diagram.json` back to disk
        (canonical ordering — nodes sorted by ID, edges by (from, to)).

        Returns the count of applied operations and the current revision.
      operationId: patchFlow
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/FlowId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchRequest"
      responses:
        "200":
          description: Patch applied successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatchResponse"
        "400":
          description: Patch validation failed (e.g. duplicate node, cycle, unknown operation).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{projectId}/validate:
    post:
      tags: [Validation]
      summary: Validate project (schema + graph + rules)
      description: |
        Runs the full validation pipeline (spec §14):
        1. JSON Schema validation against packages/ir-schema/schemas/
        2. Semantic graph validation (connectedness, cycles, dangling refs)
        3. Rule-based validators (OIW-E001..E007, OIW-W001..W012)
      operationId: validateProject
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                strict:
                  type: boolean
                  description: Treat warnings as errors.
                  default: false
      responses:
        "200":
          description: Validation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"

  /api/v1/projects/{projectId}/flows/{flowId}/simulate:
    post:
      tags: [Simulation]
      summary: Run a flow with given input and return the trace
      description: |
        Spec ref: §9.2 (Execution Engine), §9.2 step 8 (stream trace).

        Runs the flow synchronously with the provided input body, headers,
        and mocks. Returns the final exchange status, duration, full trace
        (per-node enter/exit/error events), outbound calls, and final
        headers/properties.

        For real-time streaming, use the WebSocket endpoint at /ws/trace.
      operationId: simulateFlow
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/FlowId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateRequest"
      responses:
        "200":
          description: Simulation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{projectId}/tests:run:
    post:
      tags: [Tests]
      summary: Run flow tests
      operationId: runTests
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                flowId:
                  type: string
                  description: Run tests for a specific flow only.
                testName:
                  type: string
                  description: Run a single named test.
      responses:
        "200":
          description: Test results.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TestResult"

  /api/v1/projects/{projectId}/resources:
    get:
      tags: [Resources]
      summary: List all resource files in a project
      description: |
        Spec ref: §11.1 (resources/ directory), §6.1 (Monaco Editor),
        §10.3 (editors/ component architecture).

        Enumerates all resource files under flows/<flow>/resources/.
        Returns path, name, resource_type, language (for Monaco), and size.
      operationId: listResources
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: List of resources.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResourceSummary"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{projectId}/resources/{resourcePath}:
    get:
      tags: [Resources]
      summary: Read a resource file
      description: |
        Spec ref: §6.1 (Monaco Editor), §12.4 (resource.read).
        Path traversal is prevented.
      operationId: getResource
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: resourcePath
          in: path
          required: true
          schema:
            type: string
          description: Resource path (e.g. flows/order-to-s4/resources/scripts/normalizeOrder.groovy).
      responses:
        "200":
          description: Resource content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceContent"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Resources]
      summary: Write (create or update) a resource file
      description: |
        Spec ref: §6.1 (Monaco Editor), §12.4 (resource.write MCP tool),
        §11.1 (resources/ directory).

        Path traversal is prevented. Only paths under flows/<flow>/resources/
        are allowed. Parent directories are created automatically.
      operationId: writeResource
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: resourcePath
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
      responses:
        "200":
          description: Written resource content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceContent"
        "400":
          description: Invalid path (outside resources/, path traversal).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{projectId}/builds:
    post:
      tags: [Builds]
      summary: Build a target-profile artifact package
      description: Compiles IR to a deterministic artifact package in `dist/`. Records digest in `.oiw/compiler.lock`. Spec §8, §4.7.
      operationId: buildArtifact
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetProfile]
              properties:
                targetProfile:
                  type: string
                  description: e.g. sap-cloud-integration-2026-07
      responses:
        "200":
          description: Build result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildResult"
        "400":
          description: Build failed (e.g. undeclared target profile).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/projects/{projectId}/git/status:
    get:
      tags: [Git]
      summary: Get Git status
      description: Returns branch, HEAD SHA, dirty flag, ahead count, and last build digest from `.oiw/compiler.lock`. Spec §11.
      operationId: getGitStatus
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Git status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitStatus"

  /api/v1/projects/{projectId}/diff:
    get:
      tags: [Git]
      summary: Get a structured semantic diff between revisions
      description: |
        Spec ref: §10.5 (Semantic Diff).

        Returns a structured diff between `rev` (default HEAD~1) and HEAD,
        categorized into flows/resources/tests added/modified/removed + other.
        Includes base and head SHAs and a total change count.
      operationId: getDiff
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: rev
          in: query
          schema:
            type: string
            default: HEAD~1
          description: Git revision to diff against HEAD.
      responses:
        "200":
          description: Structured diff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StructuredDiff"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/archive/inspect:
    post:
      tags: [Archive]
      summary: Safely inspect an archive without extracting it
      description: |
        Spec §8.2 (Safe Archive Reader), §16.1 threat 1.
        Defenses: max compressed size, max uncompressed size, max entry count,
        compression ratio cap, path-traversal rejection, symlink rejection.
      operationId: inspectArchive
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archive]
              properties:
                archive:
                  type: string
                  format: binary
      responses:
        "200":
          description: Archive manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveManifest"
        "400":
          description: Archive failed safety check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/experiments:
    get:
      tags: [Experiments]
      summary: List experiment campaign records
      description: |
        B2 Experiment Engine campaigns (variant ladders over the tenant
        oracle). Each record carries its rungs with verdicts and compact
        evidence. Records resolve from `<workspace>/.oiw/experiments/`.
      operationId: listExperiments
      responses:
        "200":
          description: Experiment campaign records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExperimentSummary"

  /api/v1/experiments/{experimentId}:
    get:
      tags: [Experiments]
      summary: Get one experiment campaign record (full rung detail)
      operationId: getExperiment
      parameters:
        - name: experimentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Campaign record with rungs, verdicts, evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentRecord"
        "404":
          description: Experiment record not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/laws:
    get:
      tags: [Laws]
      summary: List the tenant-law registry
      description: |
        Evidence-attached laws: engine-derived (from experiment campaigns)
        and manual blood laws. Status is `candidate | ratified | retired`;
        only RATIFIED laws are enforced (`oiw validate` OIW-W013 + the
        turbo assembler placement union). Ratification is a CLI operator
        action — this API is read-only.
      operationId: listLaws
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [candidate, ratified, retired]
          description: Filter by law status.
        - name: scope
          in: query
          required: false
          schema:
            type: string
          description: Filter by component-type scope (e.g. converter.json-to-xml).
      responses:
        "200":
          description: Law registry contents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LawRecord"

  /api/v1/projects/{projectId}/calibrations:
    get:
      tags: [Calibrations]
      summary: List cached tenant-oracle calibration reports for a project
      description: |
        Read-only listing of `<project>/.oiw/calibration-*.yaml` (cached
        oracle verdicts). Powers the local-trace vs tenant-MPL comparison.
        Reports are point-in-time (blood law): `startedAt` bounds the
        MPL epoch that is meaningful.
      operationId: listCalibrations
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Calibration report summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalibrationSummary"
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/projects/{projectId}/calibrations/{artifactId}:
    get:
      tags: [Calibrations]
      summary: Get one cached calibration report (full MPL rows)
      operationId: getCalibration
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Calibration report with MPL rows and reward vector.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalibrationReport"
        "404":
          description: No calibration report for that artifact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/health:
    get:
      tags: [Projects]
      summary: Health check
      operationId: health
      responses:
        "200":
          description: Server is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 0.1.0

components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
      description: Project identifier (lowercase kebab-case).
    FlowId:
      name: flowId
      in: path
      required: true
      schema:
        type: string
      description: Flow identifier.

  responses:
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        code:
          type: string
          description: Stable error code (e.g. OIW-E001).
        details:
          type: object
          additionalProperties: true

    ProjectSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        path:
          type: string
          description: Absolute path to the project root.
        created:
          type: string
          format: date-time
        flowCount:
          type: integer
        testCount:
          type: integer

    Project:
      type: object
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            created:
              type: string
              format: date-time
            description:
              type: string
            labels:
              type: object
              additionalProperties:
                type: string
        spec:
          type: object
          additionalProperties: true
        flows:
          type: array
          items:
            $ref: "#/components/schemas/FlowSummary"
        environments:
          type: array
          items:
            type: object
            additionalProperties: true

    FlowSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: integer
        nodeCount:
          type: integer
        testCount:
          type: integer
        labels:
          type: object
          additionalProperties:
            type: string

    IntegrationFlow:
      type: object
      description: Full flow IR. Spec §7.2.
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          type: object
          additionalProperties: true
        spec:
          type: object
          properties:
            entrypoints:
              type: array
              items:
                type: object
                additionalProperties: true
            nodes:
              type: array
              items:
                type: object
                additionalProperties: true
            edges:
              type: array
              items:
                type: object
                additionalProperties: true
            errorHandling:
              type: object
              additionalProperties: true
            extensions:
              type: object
              additionalProperties: true
        diagram:
          type: object
          additionalProperties: true
          description: Visual layout from diagram.json. Spec §7.3 rule 4.

    PatchRequest:
      type: object
      description: |
        Typed patch request. Spec §12.5.
        WP-04 Task 6: `base_revision` is REQUIRED. The server returns
        HTTP 409 Conflict with body
        `{code: "BASE_REVISION_CONFLICT", clientRevision, serverRevision}`
        when `base_revision` is missing or does not match the current
        HEAD. The agent planner captures HEAD at planning time and
        injects it into every `flow.patch` step.
      required: [base_revision, operations]
      properties:
        base_revision:
          type: string
          description: |
            REQUIRED (WP-04 Task 6). The git HEAD sha the client based
            its patch on. The server rejects stale writes with HTTP 409.
        operations:
          type: array
          minItems: 0
          items:
            type: object
            required: [op]
            properties:
              op:
                type: string
                enum: [addNode, removeNode, updateNodeConfig, addEdge, removeEdge, moveNode]
              node:
                type: object
                description: "For addNode: {id, type, config, fidelity}"
              nodeId:
                type: string
                description: "For removeNode, updateNodeConfig, moveNode"
              from:
                type: string
                description: "For addEdge, removeEdge"
              to:
                type: string
                description: "For addEdge, removeEdge"
              condition:
                type: string
                description: "Optional edge condition (for router branches)"
              config:
                type: object
                additionalProperties: true
                description: "For updateNodeConfig: partial config to merge"
              merge:
                type: boolean
                default: true
                description: "For updateNodeConfig: if false, replace the entire config"
              position:
                type: object
                properties:
                  x:
                    type: number
                  y:
                    type: number
                description: "For addNode (optional) and moveNode (required)"

    PatchResponse:
      type: object
      properties:
        applied:
          type: integer
          description: Number of operations successfully applied.
        new_revision:
          type: string
          nullable: true
          description: The current HEAD revision (unchanged until a git commit is made).
        flow_id:
          type: string

    SimulateRequest:
      type: object
      description: Simulation request. Spec §9.2, §7.4 (FlowTest input shape).
      properties:
        entrypoint:
          type: string
          description: Entrypoint node ID (optional; defaults to the first entrypoint).
        body_file:
          type: string
          description: Relative path to a fixture file for the input body.
        body_inline:
          type: string
          description: Inline input body (alternative to body_file).
        headers:
          type: object
          additionalProperties:
            type: string
        mocks:
          type: array
          items:
            type: object
            properties:
              target:
                type: string
                description: Node ID to mock.
              respond:
                type: object
                properties:
                  status:
                    type: integer
                  body:
                    type: string

    SimulationResult:
      type: object
      description: Result of a simulation run. Spec §9.2 step 8.
      properties:
        status:
          type: string
          enum: [COMPLETED, FAILED, RUNNING]
        duration_ms:
          type: integer
        trace:
          type: array
          items:
            $ref: "#/components/schemas/TraceEntry"
        outbound_calls:
          type: array
          items:
            type: object
            properties:
              target:
                type: string
              method:
                type: string
              url:
                type: string
        headers:
          type: object
          additionalProperties: true
        properties:
          type: object
          additionalProperties: true

    TraceEntry:
      type: object
      properties:
        node_id:
          type: string
        timestamp:
          type: number
        direction:
          type: string
          enum: [enter, exit, error, complete]
        summary:
          type: string

    ResourceSummary:
      type: object
      description: Resource file summary for the explorer. Spec §11.1, §6.1.
      properties:
        path:
          type: string
          description: Project-relative path (e.g. flows/order-to-s4/resources/scripts/normalizeOrder.groovy).
        name:
          type: string
          description: File name only.
        resource_type:
          type: string
          enum: [groovy, xslt, xsd, json-schema, wsdl, properties, unknown]
        language:
          type: string
          description: Monaco language ID (groovy, xml, json, yaml, ini, python, shell, plaintext).
        size:
          type: integer
          description: File size in bytes.

    ResourceContent:
      type: object
      description: Full resource file content. Spec §6.1, §12.4.
      properties:
        path:
          type: string
        content:
          type: string
        language:
          type: string
        resource_type:
          type: string
        size:
          type: integer

    ValidationResult:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        errorCount:
          type: integer
        warningCount:
          type: integer
        passed:
          type: boolean
          description: True if no errors (and no warnings when strict).

    TestResult:
      type: object
      properties:
        flowId:
          type: string
        testName:
          type: string
        passed:
          type: boolean
        durationMs:
          type: integer
        failures:
          type: array
          items:
            type: string

    BuildResult:
      type: object
      properties:
        outDir:
          type: string
        manifestPath:
          type: string
        digest:
          type: string
          description: sha256 digest of the build. Spec §4.7.
        compilerVersion:
          type: string
        targetProfile:
          type: string
        entryCount:
          type: integer

    GitStatus:
      type: object
      properties:
        branch:
          type: string
        headSha:
          type: string
        dirty:
          type: boolean
        ahead:
          type: integer
        lastBuildDigest:
          type: string
          nullable: true
        lastBuildTarget:
          type: string
          nullable: true

    StructuredDiff:
      type: object
      description: Structured semantic diff. Spec §10.5.
      properties:
        base_sha:
          type: string
        head_sha:
          type: string
        total_changes:
          type: integer
        flows:
          type: object
          properties:
            added:
              type: array
              items:
                type: string
            modified:
              type: array
              items:
                type: string
            removed:
              type: array
              items:
                type: string
        resources:
          type: object
          properties:
            added:
              type: array
              items:
                type: string
            modified:
              type: array
              items:
                type: string
            removed:
              type: array
              items:
                type: string
        tests:
          type: object
          properties:
            added:
              type: array
              items:
                type: string
            modified:
              type: array
              items:
                type: string
            removed:
              type: array
              items:
                type: string
        other:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              status:
                type: string
                enum: [added, modified, removed, renamed]
              category:
                type: string

    ArchiveManifest:
      type: object
      properties:
        path:
          type: string
        entryCount:
          type: integer
        compressedSize:
          type: integer
        uncompressedSize:
          type: integer
        compressionRatio:
          type: number
        digest:
          type: string
        warnings:
          type: array
          items:
            type: string
        entries:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              compressedSize:
                type: integer
              uncompressedSize:
                type: integer
              isDir:
                type: boolean

    Rung:
      type: object
      properties:
        rungId:
          type: string
          description: Unique rung id (encodes kind + target + position).
        kind:
          type: string
          enum: [drop, move, swap, insert]
          description: The single-variable mutation applied vs the baseline.
        target:
          type: string
          description: Node id the mutation centers on.
        detail:
          type: object
          additionalProperties: true
          description: Kind-specific payload (e.g. toPosition, newType, after).
        rationale:
          type: string
        verdict:
          type: string
          enum: [GREEN, RED, SKIPPED]
          description: |
            Oracle verdict. GREEN = STARTED + message 200 + all-epoch MPL
            COMPLETED; RED = content failure; SKIPPED = not run (budget,
            cool-down, invalid variant, or campaign abort).
        evidence:
          type: object
          additionalProperties: true
          description: |
            Compact oracle digest (finalStatus, httpStatus, mplStatuses)
            plus `targetType` — the target's component type (laws scope on
            types, not node ids).

    ExperimentSummary:
      type: object
      properties:
        experimentId:
          type: string
        baselineFlowId:
          type: string
        hypothesis:
          type: string
        createdAt:
          type: string
          format: date-time
        baselineVerdict:
          type: string
          enum: [GREEN, RED, SKIPPED]
        status:
          type: string
          enum: [draft, running, complete, aborted]
        rungCount:
          type: integer
        greenCount:
          type: integer
        redCount:
          type: integer
        skippedCount:
          type: integer

    ExperimentRecord:
      type: object
      properties:
        experimentId:
          type: string
        baselineFlowId:
          type: string
        hypothesis:
          type: string
        createdAt:
          type: string
          format: date-time
        baselineVerdict:
          type: string
          enum: [GREEN, RED, SKIPPED]
        status:
          type: string
          enum: [draft, running, complete, aborted]
        rungs:
          type: array
          items:
            $ref: "#/components/schemas/Rung"

    LawRecord:
      type: object
      properties:
        lawId:
          type: string
        statement:
          type: string
          description: Human/LLM-readable law statement.
        scope:
          type: string
          description: |
            Component-type scope (e.g. converter.json-to-xml), a
            pair-scoped refinement (receiver.http#warmup-before-converter),
            or flow.topology.
        kind:
          type: string
        origin:
          type: string
          description: Experiment id, or "manual" for blood laws.
        evidence:
          type: object
          properties:
            greenRungs:
              type: array
              items:
                type: string
            redRungs:
              type: array
              items:
                type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        status:
          type: string
          enum: [candidate, ratified, retired]
        recordedAt:
          type: string
          format: date-time
        source:
          type: string
          enum: [engine, manual]
        predicate:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            Machine-checkable form (e.g. requires-position-after with
            redPositions/greenPositions). Laws without a predicate are
            advisory-only.

    CalibrationSummary:
      type: object
      properties:
        artifactId:
          type: string
        packageId:
          type: string
        finalStatus:
          type: string
          description: Tenant runtime status (STARTED | ERROR | TIMEOUT...).
        messageSent:
          type: boolean
        httpResponseStatus:
          type: integer
          nullable: true
        mplCompleted:
          type: integer
          description: MPL rows with Status=COMPLETED (this run's epoch).
        mplFailed:
          type: integer
        rewardOverall:
          type: number
          nullable: true
        startedAt:
          type: string
          format: date-time
          description: |
            Epoch boundary — only MPL rows at/after this instant belong to
            this run (stale-row poison law).
        reportPath:
          type: string
          description: File name of the cached YAML report.

    CalibrationReport:
      type: object
      description: Full cached calibration report (calibration + reward).
      properties:
        calibration:
          type: object
          properties:
            packageId:
              type: string
            artifactId:
              type: string
            uploadedOk:
              type: boolean
            deployAccepted:
              type: boolean
            finalStatus:
              type: string
            errorDetail:
              type: string
              nullable: true
            messageSent:
              type: boolean
            httpResponseStatus:
              type: integer
              nullable: true
            mplRows:
              type: array
              items:
                type: object
                properties:
                  MessageGuid:
                    type: string
                  Status:
                    type: string
                  CustomStatus:
                    type: string
                  IntegrationFlowName:
                    type: string
                  LogStart:
                    type: string
            startedAt:
              type: string
              format: date-time
        reward:
          type: object
          nullable: true
          properties:
            overall:
              type: number
            dimensions:
              type: object
              additionalProperties:
                type: number
            allHardGatesPassed:
              type: boolean

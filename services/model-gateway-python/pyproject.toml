[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oiw-model-gateway"
version = "0.1.0"
description = "Open Integration Workbench — model gateway: LLM routing, redaction, token budgets. Spec §12.7."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Open Integration Workbench Contributors" }]
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
oiw-gateway = "oiw_gateway.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["oiw_gateway*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

apiVersion: oiw.dev/v1alpha1
kind: FlowTest
metadata:
  name: invalid-payload
  description: Invalid payload (missing required fields) fails validation.
spec:
  flow: batch-orders
  input:
    entrypoint: sender-http
    bodyInline: '{"runId":"RUN-002"}'
    headers:
      Content-Type: application/json
  mocks: []
  assertions:
    - type: node.executed
      node: validate-json
    - type: node.not-executed
      node: receiver-sftp
    - type: exchange.status
      equals: FAILED

apiVersion: oiw.dev/v1alpha1
kind: IntegrationFlow
metadata:
  id: api-to-erp
  labels:
    archetype: api-to-erp
  name: "Held Out Order Async \u2014 api-to-erp"
  version: 1
spec:
  edges:
  - from: sender-http
    to: log-receive
  - from: log-receive
    to: receiver-out
  - from: receiver-out
    to: pd-terminator
  entrypoints:
  - config:
      methods:
      - POST
      path: /api-to-erp
    fidelity: simulated
    id: sender-http
    type: sender.http
  errorHandling:
    defaultExceptionSubprocess:
      steps:
      - config:
          level: ERROR
          message: flow failed
        fidelity: compatible-subset
        id: error-log
        type: log.message
  extensions: {}
  nodes:
  - config:
      level: INFO
      message: received request
    fidelity: compatible-subset
    id: log-receive
    type: log.message
  - config:
      method: GET
      timeoutSeconds: 30
      url: https://api.open-meteo.com/v1/forecast?latitude=52.52&longitude=13.41&current=temperature_2m
    fidelity: simulated
    id: receiver-out
    type: receiver.http
  - config:
      address: /oiw_pd
    fidelity: simulated
    id: pd-terminator
    type: receiver.processdirect

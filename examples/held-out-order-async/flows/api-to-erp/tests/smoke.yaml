apiVersion: oiw.dev/v1alpha1
kind: FlowTest
metadata:
  name: smoke
  description: Held-out async order happy path reaches the receiver and logs.
spec:
  assertions:
  - equals: COMPLETED
    type: exchange.status
  - node: log-receive
    type: node.executed
  flow: api-to-erp
  input:
    bodyInline: '{}'
    entrypoint: sender-http
    headers:
      Content-Type: application/json
  mocks:
  - respond:
      body: '{}'
      status: 200
    target: receiver-out

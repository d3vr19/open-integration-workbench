# Open Integration Workbench — Docker Compose distribution.
#
# Spec ref: §18.1 (Docker Compose).
#
# Profiles:
#   default          — CLI only (Phase 0/1)
#   phase2-prototype — FastAPI server + React SPA (Phase 2 starter; ADR-PY-002)
#   phase2           — Kotlin/Spring Boot server + JVM runtime worker (not yet implemented)
#   phase3           — MCP server + model gateway (not yet implemented)
#   phase5           — EMG worker (not yet implemented)
#   team             — Gitea + Traefik + full infra
#
# Bring up the Phase 2 prototype stack:
#   docker compose -f deploy/docker-compose/docker-compose.yaml --profile phase2-prototype up -d
#
# Run a one-off CLI command:
#   docker compose -f deploy/docker-compose/docker-compose.yaml run --rm oiw-cli validate --project /workspace/examples/order-to-s4 --strict

services:
  oiw-cli:
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.cli
    volumes:
      - ../..:/workspace
    working_dir: /workspace
    environment:
      - PYTHONUNBUFFERED=1
    entrypoint: ["oiw"]

  # -------------------------------------------------------------------
  # Phase 2 prototype — FastAPI server + React SPA.
  # See ADR-PY-002 for the FastAPI deviation rationale.
  # -------------------------------------------------------------------
  oiw-server:
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.server
    profiles: ["phase2-prototype"]
    ports: ["8000:8000"]
    environment:
      - OIW_WORKSPACE=/workspace/examples
    volumes:
      - ../..:/workspace

  oiw-web:
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.web
    profiles: ["phase2-prototype"]
    ports: ["5173:80"]
    depends_on: [oiw-server]

  # The services below are placeholders for the Kotlin/Spring Boot production
  # target (Phase 2+, OW-002). They use stub Dockerfiles until implemented.

  oiw-server-kotlin:
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.stub
    profiles: ["phase2"]
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DATABASE_URL=jdbc:postgresql://postgres:5432/oiw
      - MINIO_ENDPOINT=http://minio:9000
      - REDIS_URL=redis://redis:6379
    depends_on: [postgres, minio, redis]

  oiw-runtime-worker:
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.stub
    profiles: ["phase2"]
    deploy:
      resources:
        limits: { cpus: "2", memory: 2G }
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]

  oiw-mcp-server:
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.stub
    profiles: ["phase3"]

  model-gateway:
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.stub
    profiles: ["phase3"]
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_URL=http://host.docker.internal:11434

  emg-worker:
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.stub
    profiles: ["phase5"]
    depends_on: [postgres, redis]

  gitea:
    image: gitea/gitea:1.23
    profiles: ["team"]
    volumes: ["gitea-data:/data"]
    ports: ["3000:3000", "2222:22"]

  postgres:
    image: postgres:16-alpine
    profiles: ["phase2", "phase5", "team"]
    environment:
      POSTGRES_DB: oiw
      POSTGRES_PASSWORD: ${DB_PASSWORD:-oiw-dev}
    volumes: ["pg-data:/var/lib/postgresql/data"]
    ports: ["5432:5432"]

  minio:
    image: minio/minio:latest
    profiles: ["phase2", "team"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-oiw}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-oiw-dev}
    volumes: ["minio-data:/data"]
    ports: ["9000:9000", "9001:9001"]

  redis:
    image: redis:7-alpine
    profiles: ["phase2", "phase5", "team"]
    ports: ["6379:6379"]

  traefik:
    image: traefik:v3.1
    profiles: ["team"]
    ports: ["80:80", "443:443"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]

volumes:
  pg-data:
  minio-data:
  gitea-data:

  # -------------------------------------------------------------------
  # Beta profile (WP-06 Track F-001)
  # -------------------------------------------------------------------
  # Full stack: API server + Web UI + Mock tenant adapter
  # Usage: docker compose --profile beta up -d
  oiw-server-beta:
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.server
    profiles: ["beta"]
    ports:
      - "8000:8000"
    environment:
      - OIW_WORKSPACE=/data/workspace
      - PYTHONPATH=/app/apps/cli:/app/apps/mcp-server:/app/apps/server-python-prototype
    volumes:
      - workspace-beta:/data/workspace
      - emg-store:/data/emg
    command: >
      python -m uvicorn oiw_server.main:app
      --host 0.0.0.0 --port 8000

  oiw-web-beta:
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.web
    profiles: ["beta"]
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY=http://oiw-server-beta:8000
    depends_on:
      - oiw-server-beta
    command: >
      sh -c "cd /app && npm run preview -- --host 0.0.0.0 --port 5173"

volumes:
  workspace-beta:
  emg-store:

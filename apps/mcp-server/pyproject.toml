[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oiw-mcp-server"
version = "0.1.0"
description = "Open Integration Workbench — MCP server for external LLM agents. Spec §12.4, §21.3."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Open Integration Workbench Contributors" }]
dependencies = [
    "oiw-cli",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
oiw-mcp = "oiw_mcp.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["oiw_mcp*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

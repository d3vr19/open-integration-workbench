[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oiw-cli"
version = "0.1.0"
description = "Open Integration Workbench — CLI for building, testing, reviewing, versioning, and deploying SAP Cloud Integration content."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Open Integration Workbench Contributors" }]
dependencies = [
    "jsonschema>=4.21",
    "pyyaml>=6.0",
    "click>=8.1",
    "lxml>=5.0",
    "jsonpath-ng>=1.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
oiw = "oiw.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["oiw*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oiw-cli"
version = "0.1.0"
description = "Open Integration Workbench — CLI for building, testing, reviewing, versioning, and deploying SAP Cloud Integration content."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Open Integration Workbench Contributors" }]
dependencies = [
    "jsonschema>=4.21",
    "pyyaml>=6.0",
    "click>=8.1",
    "lxml>=5.0",
    "jsonpath-ng>=1.6",
    "httpx>=0.27",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "paramiko>=3.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
# WP-08 PR-2 / Track A-002: EmbeddingGemma-300m backend.
# NOT required for CI — CI uses OIW_EMBEDDING_BACKEND=tfidf (the default).
# Install with `pip install 'oiw[embeddings]'` to enable the Gemma backend
# for local/dev/tenant learning. The model is downloaded at first use under
# Google's Gemma terms (not Apache-2.0) — see NOTICE for the license note.
embeddings = [
    "sentence-transformers>=3.0",
    "torch",  # CPU wheel is fine; no CUDA needed for inference
    # Fastembed is the lighter alternative — uncomment to enable.
    # "fastembed>=0.3",
]

[project.scripts]
oiw = "oiw.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["oiw*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

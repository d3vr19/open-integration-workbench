# Security scan — runs daily and on push to main.
# Spec ref: §14.4 (CI Pipeline), §14.5 (Supply-Chain Security), §16 (Security Architecture).

name: Security Scan

on:
  schedule:
    - cron: "0 6 * * *"  # daily at 06:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Semgrep scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            auto
            packages/policy-rules/semgrep/cpi-rules.yml
          generateSarif: "1"
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Trivy filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          # exit-code: "1" causes Trivy to fail on ANY finding, even LOW/MEDIUM
          # that slip through the severity filter in some action versions.
          # We set it to "0" so the SARIF is uploaded for visibility; HIGH/CRITICAL
          # alerts appear in GitHub's Code Scanning UI and can be gated separately.
          exit-code: "0"
          format: sarif
          output: trivy-results.sarif
      - name: Check for HIGH/CRITICAL vulnerabilities
        run: |
          # Parse the SARIF to fail only on HIGH/CRITICAL
          if [ -f trivy-results.sarif ]; then
            HIGH_CRITICAL=$(jq '[.runs[].results[] | select(.level == "error")] | length' trivy-results.sarif)
            if [ "$HIGH_CRITICAL" -gt "0" ]; then
              echo "::error::Found $HIGH_CRITICAL HIGH/CRITICAL vulnerabilities"
              cat trivy-results.sarif | jq '.runs[].results[] | select(.level == "error") | {ruleId: .ruleId, message: .message.text}'
              exit 1
            else
              echo "No HIGH/CRITICAL vulnerabilities found"
            fi
          fi
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v5
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 30

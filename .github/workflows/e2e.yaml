# Playwright E2E tests for the co-pilot UI (WP-04 Task 9, OW-026).
# Spec ref: §10 (Visual Designer), §12.3 (Interaction Modes).
#
# This workflow runs the Playwright E2E suite against a live stack:
#   1. Python API server (apps/server-python-prototype) on :8000
#   2. Vite dev server (apps/web) on :5173
#   3. Playwright chromium browser
#
# The test workspace is a git-init'd copy of examples/order-to-s4 so
# baseRevision validation (WP-04 Task 6) passes.
#
# Tests: apps/web/e2e/copilot.spec.ts (2 tests)
#   - test_copilot_suggest_and_apply (mandatory)
#   - test_copilot_reject_plan (bonus)
#
# Pass criteria: both tests must pass. A failure means the co-pilot
# UI flow broke — investigate immediately.

name: E2E Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-e2e:
    name: Playwright E2E (co-pilot)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download Groovy JARs + compile GroovyRunner
        run: bash services/runtime-worker-jvm/setup.sh

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -e apps/cli
          pip install -e apps/mcp-server
          pip install -e apps/server-python-prototype
          pip install uvicorn

      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Set up test workspace
        run: |
          # Create a test workspace with a git-init'd copy of order-to-s4
          mkdir -p /tmp/e2e-workspace
          cp -r examples/order-to-s4 /tmp/e2e-workspace/
          cd /tmp/e2e-workspace/order-to-s4
          git init -q
          git add .
          git -c user.email="e2e@test.com" -c user.name="E2E" commit -q -m "test fixture"
          echo "Test workspace ready at /tmp/e2e-workspace"

      - name: Start Python API server
        run: |
          uvicorn oiw_server.main:app \
            --host 127.0.0.1 \
            --port 8000 \
            --log-level warning &
          API_PID=$!
          echo "API_PID=$API_PID" >> $GITHUB_ENV
          # Wait for server to be ready
          for i in {1..10}; do
            if curl -s http://127.0.0.1:8000/api/v1/projects | grep -q "order-to-s4"; then
              echo "API server ready"
              break
            fi
            sleep 1
          done
        env:
          OIW_WORKSPACE: /tmp/e2e-workspace
          PYTHONPATH: ${{ github.workspace }}/apps/cli:${{ github.workspace }}/apps/mcp-server:${{ github.workspace }}/apps/server-python-prototype

      - name: Run Playwright tests
        run: npx playwright test --reporter=list
        working-directory: apps/web
        env:
          OIW_WORKSPACE: /tmp/e2e-workspace
          PYTHONPATH: ${{ github.workspace }}/apps/cli:${{ github.workspace }}/apps/mcp-server:${{ github.workspace }}/apps/server-python-prototype

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: server-logs
          path: |
            /tmp/e2e-workspace/order-to-s4/.oiw/
          retention-days: 7

  e2e-aggregate:
    name: e2e (aggregate)
    runs-on: ubuntu-latest
    needs: [playwright-e2e]
    if: always()
    steps:
      - name: Aggregate
        run: |
          echo "playwright-e2e: ${{ needs.playwright-e2e.result }}"
          if [[ "${{ needs.playwright-e2e.result }}" != "success" ]]; then
            echo "::error::Playwright E2E tests failed"
            exit 1
          fi
          echo "E2E suite passed"
